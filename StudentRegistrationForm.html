<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration Form</title>

<style>

/* =========================================================
   BASIC RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding: 55px 20px;

    font-family: "Segoe UI", Arial, sans-serif;

    color: #f8fafc;

    overflow-x: hidden;

    background:
        linear-gradient(
            135deg,
            #020617,
            #071426,
            #111827,
            #080d1d,
            #020617
        );
}


/* =========================================================
   PREMIUM MOVING 3D BACKGROUND
========================================================= */

body::before {

    content: "";

    position: fixed;

    width: 750px;
    height: 750px;

    top: -300px;
    left: -250px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at center,
            rgba(59,130,246,0.30),
            rgba(37,99,235,0.12),
            transparent 68%
        );

    filter: blur(15px);

    z-index: -2;

    animation:
        blueOrb 14s ease-in-out infinite;
}


/* GOLD 3D ORB */

body::after {

    content: "";

    position: fixed;

    width: 650px;
    height: 650px;

    right: -250px;
    bottom: -230px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at center,
            rgba(212,175,55,0.20),
            rgba(180,130,20,0.08),
            transparent 70%
        );

    filter: blur(20px);

    z-index: -2;

    animation:
        goldOrb 16s ease-in-out infinite;
}


/* =========================================================
   BACKGROUND ANIMATION
========================================================= */

@keyframes blueOrb {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    50% {
        transform:
            translate(420px,220px)
            scale(1.25);
    }

    100% {
        transform:
            translate(0,0)
            scale(1);
    }
}


@keyframes goldOrb {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    50% {
        transform:
            translate(-300px,-180px)
            scale(1.2);
    }

    100% {
        transform:
            translate(0,0)
            scale(1);
    }
}


/* =========================================================
   DECORATIVE 3D LIGHT
========================================================= */

.background-light {

    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(99,102,241,0.18),
            transparent 70%
        );

    filter: blur(20px);

    z-index: -1;

    animation: floatingLight 10s ease-in-out infinite;
}


@keyframes floatingLight {

    0% {
        transform:
            translate(0,0)
            rotate(0deg);
    }

    50% {
        transform:
            translate(180px,-120px)
            rotate(180deg);
    }

    100% {
        transform:
            translate(0,0)
            rotate(360deg);
    }
}


/* =========================================================
   FORM WRAPPER
========================================================= */

.form-wrapper {

    position: relative;

    width: 700px;

    perspective: 1200px;
}


/* =========================================================
   GLOW BEHIND FORM
========================================================= */

.form-wrapper::before {

    content: "";

    position: absolute;

    inset: -25px;

    border-radius: 35px;

    background:
        linear-gradient(
            135deg,
            rgba(37,99,235,0.25),
            rgba(124,58,237,0.20),
            rgba(212,175,55,0.15)
        );

    filter: blur(30px);

    z-index: -1;

    animation: formGlow 7s ease-in-out infinite;
}


@keyframes formGlow {

    0% {
        transform: scale(0.98);
        opacity: 0.55;
    }

    50% {
        transform: scale(1.04);
        opacity: 1;
    }

    100% {
        transform: scale(0.98);
        opacity: 0.55;
    }
}


/* =========================================================
   FORM
========================================================= */

form {

    width: 100%;

    padding: 48px 52px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(20,32,61,0.97),
            rgba(8,18,39,0.98),
            rgba(28,22,54,0.97)
        );

    border:
        1px solid
        rgba(255,255,255,0.18);

    box-shadow:

        0 40px 100px
        rgba(0,0,0,0.75),

        0 15px 40px
        rgba(30,64,175,0.18),

        inset 0 1px 2px
        rgba(255,255,255,0.22),

        inset 0 -30px 70px
        rgba(0,0,0,0.18);

    backdrop-filter: blur(22px);

    transform:
        rotateX(1deg);

    transition:
        transform 0.4s ease,
        box-shadow 0.4s ease;
}


/* FORM HOVER */

form:hover {

    transform:
        rotateX(0deg)
        translateY(-5px);

    box-shadow:

        0 50px 120px
        rgba(0,0,0,0.82),

        0 0 45px
        rgba(59,130,246,0.15),

        inset 0 1px 3px
        rgba(255,255,255,0.25);
}


/* =========================================================
   HEADING
========================================================= */

h1 {

    text-align: center;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 30px;

    font-weight: 700;

    letter-spacing: 2.5px;

    color: #ffffff;

    margin-bottom: 38px;

    text-shadow:

        0 4px 15px
        rgba(0,0,0,0.7),

        0 0 20px
        rgba(96,165,250,0.25);
}


/* GOLD LINE */

h1::after {

    content: "";

    display: block;

    width: 100px;

    height: 2px;

    margin:
        13px auto 0;

    background:

        linear-gradient(
            90deg,
            transparent,
            #d4af37,
            #f1d77a,
            #d4af37,
            transparent
        );

    box-shadow:
        0 0 10px
        rgba(212,175,55,0.35);
}


/* =========================================================
   LABELS
========================================================= */

.field-label {

    display: inline-block;

    width: 145px;

    padding-left: 5px;

    color: #e5e7eb;

    font-weight: 600;

    letter-spacing: 0.3px;

    text-shadow:
        0 2px 5px rgba(0,0,0,0.4);
}


/* =========================================================
   INPUT FIELDS
========================================================= */

input[type="number"],
input[type="text"],
input[type="date"],
input[type="email"],
input[type="tel"],
textarea {

    width: 285px;

    height: 42px;

    padding:
        9px 14px;

    border:

        1px solid
        rgba(148,163,184,0.55);

    border-radius: 10px;

    outline: none;

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #e9edf5
        );

    color: #172033;

    font-size: 14px;

    box-shadow:

        0 6px 16px
        rgba(0,0,0,0.28),

        inset 0 1px
        rgba(255,255,255,0.95);

    transition:
        all 0.25s ease;
}


/* TEXTAREA */

textarea {

    height: 82px;

    resize: none;
}


/* PLACEHOLDER */

input::placeholder,
textarea::placeholder {

    color: #9ca3af;

    opacity: 1;
}


/* INPUT HOVER */

input[type="number"]:hover,
input[type="text"]:hover,
input[type="date"]:hover,
input[type="email"]:hover,
input[type="tel"]:hover,
textarea:hover {

    border-color:
        rgba(212,175,55,0.65);

    transform:
        translateY(-1px);
}


/* INPUT FOCUS */

input:focus,
textarea:focus {

    border-color:
        #d4af37;

    transform:
        translateY(-2px);

    box-shadow:

        0 0 0 3px
        rgba(212,175,55,0.13),

        0 9px 25px
        rgba(0,0,0,0.35),

        inset 0 1px
        white;
}


/* =========================================================
   RADIO BUTTONS
========================================================= */

input[type="radio"] {

    accent-color:
        #d4af37;

    transform:
        scale(1.12);

    cursor: pointer;
}


label[for="male"],
label[for="female"] {

    color: #dbe4f0;

    margin-right: 12px;

    cursor: pointer;
}


/* =========================================================
   FILE INPUT
========================================================= */

input[type="file"] {

    width: 285px;

    color: #dbe4f0;

    font-size: 13px;
}


input[type="file"]::file-selector-button {

    padding:
        9px 14px;

    margin-right: 8px;

    border: none;

    border-radius: 8px;

    background:

        linear-gradient(
            135deg,
            #d4af37,
            #b8860b
        );

    color: #111827;

    font-weight: 700;

    cursor: pointer;

    transition:
        0.25s;

    box-shadow:

        0 5px 15px
        rgba(212,175,55,0.20);
}


input[type="file"]::file-selector-button:hover {

    transform:
        translateY(-2px);

    box-shadow:

        0 8px 20px
        rgba(212,175,55,0.35);
}


/* =========================================================
   ERROR
========================================================= */

.error-field {

    border:
        2px solid
        #f43f5e !important;

    box-shadow:

        0 0 0 3px
        rgba(244,63,94,0.15) !important;
}


.error-message {

    display: block;

    margin:
        6px 0 6px 145px;

    color:
        #fb7185;

    font-size:
        12px;

    font-weight:
        bold;
}


/* =========================================================
   BUTTONS
========================================================= */

input[type="submit"],
input[type="reset"] {

    padding:
        13px 32px;

    border: none;

    border-radius: 10px;

    font-size:
        14px;

    font-weight:
        700;

    letter-spacing:
        0.4px;

    cursor:
        pointer;

    transition:
        all 0.25s ease;
}


/* =========================================================
   SUBMIT BUTTON
========================================================= */

input[type="submit"] {

    margin-left:
        145px;

    background:

        linear-gradient(
            135deg,
            #d4af37,
            #b8860b,
            #e5c45c
        );

    color:
        #111827;

    box-shadow:

        0 8px 25px
        rgba(212,175,55,0.28);
}


input[type="submit"]:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 13px 30px
        rgba(212,175,55,0.45);
}


input[type="submit"]:active {

    transform:
        scale(0.96);
}


/* =========================================================
   RESET BUTTON
========================================================= */

input[type="reset"] {

    margin-left:
        10px;

    background:

        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5,
            #6366f1
        );

    color:
        white;

    box-shadow:

        0 8px 25px
        rgba(79,70,229,0.30);
}


input[type="reset"]:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 13px 30px
        rgba(79,70,229,0.45);
}


/* =========================================================
   SUCCESS MESSAGE
========================================================= */

.success-message {

    margin:
        20px 0 0 145px;

    padding:
        12px;

    border-radius:
        10px;

    background:
        rgba(34,197,94,0.12);

    border:
        1px solid
        rgba(74,222,128,0.35);

    color:
        #86efac;

    text-align:
        center;

    font-weight:
        bold;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,0.20);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    body {

        padding:
            30px 15px;
    }

    .form-wrapper {

        width:
            100%;
    }

    form {

        padding:
            32px 22px;
    }

    .field-label {

        width:
            115px;
    }

    input[type="number"],
    input[type="text"],
    input[type="date"],
    input[type="email"],
    input[type="tel"],
    textarea,
    input[type="file"] {

        width:
            calc(100% - 120px);
    }

    input[type="submit"] {

        margin-left:
            115px;
    }

    .error-message,
    .success-message {

        margin-left:
            115px;
    }
}


@media (max-width: 480px) {

    body {

        padding:
            20px 10px;
    }

    form {

        padding:
            28px 16px;
    }

    h1 {

        font-size:
            21px;
    }

    .field-label {

        display:
            block;

        width:
            100%;

        margin-bottom:
            7px;

        padding-left:
            0;
    }

    input[type="number"],
    input[type="text"],
    input[type="date"],
    input[type="email"],
    input[type="tel"],
    textarea,
    input[type="file"] {

        width:
            100%;
    }

    input[type="submit"] {

        margin-left:
            0;
    }

    .error-message,
    .success-message {

        margin-left:
            0;
    }
}

</style>

</head>


<body>


<!-- FLOATING LIGHT -->

<div class="background-light"></div>


<div class="form-wrapper">


<form id="registrationForm">


<h1>STUDENT REGISTRATION FORM</h1>


<label class="field-label" for="reg-id">
    Reg ID:
</label>

<input
    type="number"
    id="reg-id"
    placeholder="Enter registration ID"
    required
>

<br><br>


<label class="field-label" for="name">
    Name:
</label>

<input
    type="text"
    id="name"
    required
>

<br><br>


<label class="field-label">
    Gender:
</label>

<input
    type="radio"
    id="male"
    name="gender"
    required
>

<label for="male">
    Male
</label>

<input
    type="radio"
    id="female"
    name="gender"
>

<label for="female">
    Female
</label>

<br><br>


<label class="field-label" for="dob">
    DOB:
</label>

<input
    type="date"
    id="dob"
    required
>

<br><br>


<label class="field-label" for="email">
    Email ID:
</label>

<input
    type="email"
    id="email"
    required
>

<br><br>


<label class="field-label" for="phone">
    Phone Number:
</label>

<input
    type="tel"
    id="phone"
    required
>

<br><br>


<label class="field-label" for="department">
    Department:
</label>

<input
    type="text"
    id="department"
    required
>

<br><br>


<label class="field-label" for="course">
    Course:
</label>

<input
    type="text"
    id="course"
    required
>

<br><br>


<label class="field-label" for="college">
    College:
</label>

<input
    type="text"
    id="college"
    required
>

<br><br>


<label class="field-label" for="address">
    Address:
</label>

<textarea
    id="address"
    required
></textarea>

<br><br>


<label class="field-label" for="resume">
    Resume:
</label>

<input
    type="file"
    id="resume"
    required
>

<br><br>


<input
    type="submit"
    value="Submit"
>

<input
    type="reset"
    value="Reset"
>


</form>

</div>


<script>

/* =========================================================
   FORM
========================================================= */

const form =
    document.getElementById(
        "registrationForm"
    );


/* =========================================================
   PLACEHOLDERS
========================================================= */

const placeholders = {

    "reg-id":
        "Enter registration ID",

    "name":
        "Enter your name",

    "dob":
        "Select date of birth",

    "email":
        "Enter your email",

    "phone":
        "Enter phone number",

    "department":
        "Enter department",

    "course":
        "Enter course",

    "college":
        "Enter college name",

    "address":
        "Enter your address"

};


/* =========================================================
   FIELDS
========================================================= */

const fields =
    form.querySelectorAll(
        "input:not([type='radio']):not([type='submit']):not([type='reset']), textarea"
    );


document.getElementById(
    "reg-id"
).placeholder =
    placeholders["reg-id"];


/* =========================================================
   PLACEHOLDER BEHAVIOUR
========================================================= */

fields.forEach(field => {

    field.addEventListener(
        "focus",
        function() {

            if (
                !field.value &&
                field.id !== "reg-id"
            ) {

                field.placeholder =
                    placeholders[field.id] || "";

            }

        }
    );


    field.addEventListener(
        "blur",
        function() {

            if (
                !field.value &&
                field.id !== "reg-id"
            ) {

                field.placeholder = "";

            }

        }
    );


    field.addEventListener(
        "input",
        function() {

            if (field.value) {

                removeError(field);

            }

        }
    );


    field.addEventListener(
        "change",
        function() {

            if (
                field.type === "file"
                    ? field.files.length > 0
                    : field.value
            ) {

                removeError(field);

            }

        }
    );

});


/* =========================================================
   REMOVE ERROR
========================================================= */

function removeError(field) {

    field.classList.remove(
        "error-field"
    );

    const error =
        field.parentElement.querySelector(
            ".error-message"
        );

    if (error) {

        error.remove();

    }

}


/* =========================================================
   SUBMIT VALIDATION
========================================================= */

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        document
            .querySelectorAll(
                ".error-message"
            )
            .forEach(
                e => e.remove()
            );


        document
            .querySelectorAll(
                ".error-field"
            )
            .forEach(
                e =>
                    e.classList.remove(
                        "error-field"
                    )
            );


        document
            .querySelectorAll(
                ".success-message"
            )
            .forEach(
                e => e.remove()
            );


        let firstInvalid = null;


        fields.forEach(field => {

            const empty =
                field.type === "file"
                    ? field.files.length === 0
                    : field.value.trim() === "";


            if (empty) {

                field.classList.add(
                    "error-field"
                );


                const error =
                    document.createElement(
                        "span"
                    );


                error.className =
                    "error-message";


                let label =
                    field.previousElementSibling
                        .textContent
                        .trim()
                        .replace(
                            ":",
                            ""
                        );


                error.textContent =
                    label +
                    " is incomplete and mandatory.";


                field.parentElement.insertBefore(
                    error,
                    field.nextSibling
                );


                if (!firstInvalid) {

                    firstInvalid =
                        field;

                }

            }

        });


        /* GENDER VALIDATION */

        const gender =
            document.querySelectorAll(
                "input[name='gender']"
            );


        if (
            ![...gender].some(
                radio => radio.checked
            )
        ) {

            gender.forEach(
                radio =>
                    radio.classList.add(
                        "error-field"
                    )
            );


            const error =
                document.createElement(
                    "span"
                );


            error.className =
                "error-message";


            error.textContent =
                "Gender is incomplete and mandatory.";


            gender[1].parentElement.insertBefore(
                error,
                gender[1].nextSibling
            );


            if (!firstInvalid) {

                firstInvalid =
                    gender[0];

            }

        }


        /* STOP IF INVALID */

        if (firstInvalid) {

            firstInvalid.focus();

            return;

        }


        /* SUCCESS */

        const success =
            document.createElement(
                "div"
            );


        success.className =
            "success-message";


        success.textContent =
            "✓ Registration submitted successfully!";


        form.appendChild(
            success
        );

    }
);


/* =========================================================
   RESET
========================================================= */

form.addEventListener(
    "reset",
    function() {

        setTimeout(
            () => {

                document
                    .querySelectorAll(
                        ".error-message"
                    )
                    .forEach(
                        e => e.remove()
                    );


                document
                    .querySelectorAll(
                        ".error-field"
                    )
                    .forEach(
                        e =>
                            e.classList.remove(
                                "error-field"
                            )
                    );


                document
                    .querySelectorAll(
                        ".success-message"
                    )
                    .forEach(
                        e => e.remove()
                    );


                document.getElementById(
                    "reg-id"
                ).placeholder =
                    placeholders["reg-id"];


                fields.forEach(
                    field => {

                        if (
                            field.id !== "reg-id"
                        ) {

                            field.placeholder =
                                "";

                        }

                    }
                );

            },
            10
        );

    }
);

</script>


</body>

</html>
